<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Frontend Mentor | E-commerce product page</title>

  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
  <!-- Collections
  Men
  Women
  About
  Contact

  Sneaker Company

  Fall Limited Edition Sneakers

  These low-profile sneakers are your perfect casual wear companion. Featuring a 
  durable rubber outer sole, they’ll withstand everything the weather can offer.

  $125.00
  50%
  $250.00

  0
  Add to cart -->
  <nav class="navbar">
    <div class="selection-section">
      <div class="logo-container">
        <img class="hamburger" src="./images/icon-menu.svg" alt="">
        <img class="logo" src="./images/logo.svg" alt="">
      </div>
      <div class="selection-container">
        <img class="close" src="./images/icon-close.svg" alt="">
        <div class="selection-wrapper">
          <p class="selection">Collections</p>
          <p class="selection">Men</p>
          <p class="selection">Women</p>
          <p class="selection">About</p>
          <p class="selection">Contact</p>
        </div>
      </div>
    </div>
    <div class="cart-section">
      <img class="cart-icon" src="./images/icon-cart.svg" alt="">
      <img class="user-profile" src="./images/image-avatar.png" alt="">
    </div>
  </nav>
  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
